<div class="content-card">
  <!-- 頁面標題區塊 -->
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h3 class="m-0 font-weight-bold" style="color: var(--text-dark);">
      <i class="fas fa-tags me-2" style="color: var(--primary-color-start);"></i>廠商詢價與成本管理
    </h3>
    <!-- Excel 匯入 / 匯出按鈕區塊 -->
    <div class="action-buttons">
      <input type="file" id="importInput" accept=".xlsx, .xls" style="display: none;" />
      <button id="importBtn" class="btn btn-info" disabled>
        <i class="fas fa-file-import me-1"></i>匯入 Excel
      </button>
      <button id="exportBtn" class="btn btn-success" disabled>
        <i class="fas fa-file-export me-1"></i>匯出 Excel
      </button>
      <button id="saveCostBtn" class="btn btn-primary" disabled>
        <i class="fas fa-save me-1"></i>儲存成本詢價
      </button>
    </div>
  </div>

  <!-- 多層級下拉選單排版區塊 -->
  <div class="row g-3 align-items-end mb-4">
    <!-- 選擇專案 -->
    <div class="col-md-4">
      <div class="form-group">
        <label for="projectSelect">選擇專案</label>
        <select id="projectSelect" class="form-control">
          <option value="">載入專案中...</option>
        </select>
      </div>
    </div>

    <!-- 選擇標單 -->
    <div class="col-md-4">
      <div class="form-group">
        <label for="tenderSelect">選擇標單</label>
        <select id="tenderSelect" class="form-control" disabled>
          <option value="">請先選擇專案</option>
        </select>
      </div>
    </div>

    <!-- 選擇大項目 -->
    <div class="col-md-4">
      <div class="form-group">
        <label for="majorItemSelect">選擇大項目</label>
        <select id="majorItemSelect" class="form-control" disabled>
          <option value="">請先選擇標單</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 未選擇時的 Empty State -->
  <div id="emptyState" class="empty-state" style="display: flex;">
    <i class="fas fa-search empty-state-icon"></i>
    <p>請依序選擇專案、標單與大項目以檢視與編輯細項成本</p>
  </div>

  <!-- 資料表格區塊 -->
  <div id="mainContent" class="table-container" style="display: none;">
    <table class="table align-middle">
      <thead>
        <tr>
          <th style="width: 110px; text-align: center;">項次</th>
          <th style="width: 250px;">細項名稱</th>
          <th style="width: 80px; text-align: center;">單位</th>
          <th style="width: 90px; text-align: right;">數量</th>
          <th style="width: 120px; text-align: right;">預算單價</th>
          <th style="width: 140px; text-align: right;">報價單價</th>
          <th style="width: 180px;">報價廠商</th>
          <th>備註</th>
        </tr>
      </thead>
      <tbody id="costTableBody">
        <!-- 由 JS 動態繪製 -->
      </tbody>
    </table>
  </div>
</div>

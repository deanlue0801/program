<!-- 使用 style.css 原生的 glass 質感卡片結構 -->
<div class="content-card">
  <!-- 頁面標題區塊 -->
  <div class="d-flex align-items-center mb-4">
    <h3 class="m-0 font-weight-bold" style="color: var(--text-dark);">
      <i class="fas fa-tags me-2" style="color: var(--primary-color-start);"></i>廠商詢價與成本管理
    </h3>
  </div>

  <!-- 選單與按鈕排版區塊 -->
  <div class="row g-3 align-items-end">
    <!-- 選擇專案 -->
    <div class="col-md-5">
      <div class="form-group">
        <label for="projectSelect">選擇專案</label>
        <select id="projectSelect" class="form-control">
          <option value="">載入專案中...</option>
        </select>
      </div>
    </div>

    <!-- 選擇標單 -->
    <div class="col-md-4">
      <div class="form-group">
        <label for="tenderSelect">選擇標單</label>
        <select id="tenderSelect" class="form-control" disabled>
          <option value="">請先選擇專案</option>
        </select>
      </div>
    </div>

    <!-- 儲存按鈕 -->
    <div class="col-md-3 text-end">
      <button id="saveCostBtn" class="btn btn-primary w-100" style="justify-content: center; height: 42px;" disabled>
        <i class="fas fa-save"></i> 儲存成本詢價
      </button>
    </div>
  </div>
</div>

    <!-- 詢價清單表格 -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="costTable">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 80px;">項次</th>
                            <th>項目名稱</th>
                            <th>規格說明</th>
                            <th style="width: 70px;">單位</th>
                            <th style="width: 90px;" class="text-end">數量</th>
                            <th style="width: 140px;" class="text-end">廠商詢價單價 (成本)</th>
                            <th style="width: 140px;" class="text-end">成本總價</th>
                            <th style="width: 160px;">詢價廠商 / 備註</th>
                        </tr>
                    </thead>
                    <tbody id="costTableBody">
                        <tr>
                            <td colspan="8" class="text-center text-muted py-4">請先選取專案與標單</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="content-card quotes-analysis-page">
  <!-- 頁面標題區塊 -->
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h3 class="m-0 font-weight-bold" style="color: var(--text-dark);">
      <i class="fas fa-chart-line me-2" style="color: var(--primary-color-start);"></i>對業主報價與利潤分析
    </h3>
    <!-- 匯出與儲存按鈕區塊 -->
    <div class="action-buttons">
      <button id="exportQuoteBtn" class="btn btn-success" disabled>
        <i class="fas fa-file-excel me-1"></i>匯出對業主報價單
      </button>
      <button id="saveOwnerQuoteBtn" class="btn btn-primary" disabled>
        <i class="fas fa-save me-1"></i>儲存報價設定
      </button>
    </div>
  </div>

  <!-- 多層級下拉選單與大項目切換 -->
  <div class="row g-3 align-items-end mb-4">
    <div class="col-md-4">
      <div class="form-group">
        <label for="analysisProjectSelect">選擇專案</label>
        <select id="analysisProjectSelect" class="form-control">
          <option value="">載入專案中...</option>
        </select>
      </div>
    </div>
    <div class="col-md-4">
      <div class="form-group">
        <label for="analysisTenderSelect">選擇標單</label>
        <select id="analysisTenderSelect" class="form-control" disabled>
          <option value="">請先選擇專案</option>
        </select>
      </div>
    </div>
    <div class="col-md-4">
      <div class="form-group">
        <label for="analysisMajorItemSelect">檢視範圍 (大項目)</label>
        <select id="analysisMajorItemSelect" class="form-control" disabled>
          <option value="">請先選擇標單</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 總覽與毛利分析 Summary Cards -->
  <div id="summaryCardsSection" class="row g-3 mb-4" style="display: none;">
    <div class="col-md-3">
      <div class="stat-card-lg original" style="background:#fff; border-radius:8px; padding:15px; border-left:4px solid var(--info-color); box-shadow:var(--shadow-md);">
        <div class="stat-label">總成本 (詢價成本)</div>
        <div id="totalCostVal" class="stat-value text-muted">NT$ 0</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card-lg addition" style="background:#fff; border-radius:8px; padding:15px; border-left:4px solid var(--warning-color); box-shadow:var(--shadow-md);">
        <div class="stat-label">預算總價 (預算單價)</div>
        <div id="totalBudgetVal" class="stat-value">NT$ 0</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card-lg total" style="background:#fff; border-radius:8px; padding:15px; border-left:4px solid var(--primary-color-start); box-shadow:var(--shadow-md);">
        <div class="stat-label">對業主報價總價</div>
        <div id="totalOwnerVal" class="stat-value style="color:var(--primary-color-start);">NT$ 0</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card-lg percentage" style="background:#fff; border-radius:8px; padding:15px; border-left:4px solid var(--success-color); box-shadow:var(--shadow-md);">
        <div class="stat-label">預估毛利 / 毛利率</div>
        <div id="totalMarginVal" class="stat-value text-success">NT$ 0 (0%)</div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div id="analysisEmptyState" class="empty-state" style="display: flex;">
    <i class="fas fa-calculator empty-state-icon"></i>
    <p>請選擇專案與標單以進行業主報價調整與利潤分析</p>
  </div>

  <!-- 資料表格區塊 -->
  <div id="analysisMainContent" class="table-container" style="display: none;">
    <table class="table align-middle">
      <thead>
        <tr>
          <th style="width: 110px; text-align: center;">項次</th>
          <th style="width: 250px;">細項名稱</th>
          <th style="width: 70px; text-align: center;">單位</th>
          <th style="width: 80px; text-align: right;">數量</th>
          <th style="width: 110px; text-align: right;">詢價成本單價</th>
          <th style="width: 130px; text-align: right;">對業主報價單價</th>
          <th style="width: 130px; text-align: right;">對業主報價小計</th>
          <th style="width: 110px; text-align: right;">預估毛利</th>
          <th style="width: 90px; text-align: right;">毛利率</th>
        </tr>
      </thead>
      <tbody id="analysisTableBody">
        <!-- 由 JS 動態繪製 -->
      </tbody>
    </table>
  </div>
</div>
